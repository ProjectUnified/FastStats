name: Build & Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install quilt
        run: sudo apt-get update && sudo apt-get install -y quilt
      - name: Generate sources from pinned upstream
        run: bash scripts/sync-upstream.sh
      - name: Build
        run: mvn clean install
      - name: Build Fabric mod platform
        run: cd mod-platforms/fabric && ./gradlew build --no-daemon
  automerge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
