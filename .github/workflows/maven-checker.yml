name: Build & Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install gitfile
        run: pip install "git+https://github.com/ProjectUnified/GitFile.git"
      - name: Generate sources from pinned upstream
        run: gitfile sync
      - name: Build
        run: mvn clean install
      - name: Build Fabric mod platform
        run: cd mod-platforms/fabric && ./gradlew build --no-daemon
  automerge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
